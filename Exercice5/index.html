<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Accessible</title>
</head>
<body>
    <header>
        <h1>Titre de la Page</h1>
    </header>
    <main>
        <p>Ceci est un paragraphe de texte.</p>
        <form>
            <div>
                <label for="name">Votre nom :</label>
                <input id="name" type="text" placeholder="Entrez votre nom" aria-required="true">
            </div>
            <div>
                <label for="email">Votre adresse e-mail :</label>
                <input id="email" type="email" placeholder="Entrez votre adresse e-mail" aria-required="true">
            </div>
            <button type="submit">Envoyer</button>
        </form>
        <img src="assets/image.png" alt="Description de l'image" height="250">
        <a href="#" title="En savoir plus sur notre site">En savoir plus sur notre site</a>
    </main>
</body>
</html>
